# Pages de partage article / dressing — reverse proxy vers Supabase Edge Functions
#
# Option A (VPS / Apache avec mod_proxy) : inclure ce fichier dans le VirtualHost *:443
# Option B (WordPress / hébergement mutualisé) : préférer le dossier `wordpress/`
#
# Modules requis : rewrite proxy proxy_http headers ssl
#
#   a2enmod rewrite proxy proxy_http headers ssl
#   systemctl reload apache2
#
# IMPORTANT : supprimer toute Redirect / RedirectMatch / RewriteRule [R=302]
# vers supabase.co pour /listing/ et /dressing/ — sinon le navigateur affiche
# du HTML brut ou une page « 302 Found ».

SSLProxyEngine On

# Universal Links (iOS) et App Links (Android)
Alias /.well-known/apple-app-site-association /var/www/bloomi-well-known/apple-app-site-association
<Location "/.well-known/apple-app-site-association">
    Header set Content-Type "application/json"
    Header set Cache-Control "public, max-age=3600"
</Location>

Alias /.well-known/assetlinks.json /var/www/bloomi-well-known/assetlinks.json
<Location "/.well-known/assetlinks.json">
    Header set Content-Type "application/json"
    Header set Cache-Control "public, max-age=3600"
</Location>

# IMPORTANT : proxy inverse, PAS de Redirect 302
RewriteEngine On
RewriteRule ^listing/([0-9a-fA-F-]{36})/?$ https://uzkrxkoussjnlyyykkul.supabase.co/functions/v1/listing-share?id=$1 [P,L]
RewriteRule ^dressing/([0-9a-fA-F-]{36})/?$ https://uzkrxkoussjnlyyykkul.supabase.co/functions/v1/closet-share?id=$1 [P,L]

RequestHeader set X-Forwarded-Host "bloomi.ch"
RequestHeader set X-Forwarded-Proto "https"
